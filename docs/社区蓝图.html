<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>知衡社区蓝图</title>
<style>html,body{margin:0;background:#fbfaf6}</style></head>
<body>
<svg id="map" width="1600" height="1000" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" font-family="Noto Sans CJK SC">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b7a71"/></marker>
  </defs>
  <rect width="1600" height="1000" fill="#fbfaf6"/>
  <!-- title -->
  <text x="800" y="70" text-anchor="middle" font-size="40" font-weight="bold" fill="#235c42" letter-spacing="6">知衡 · 社区蓝图</text>
  <text x="800" y="108" text-anchor="middle" font-size="20" fill="#6b7a71">四个角色：两个真人，两个智能体　·　点对点，没有中心</text>

  <!-- heaven band -->
  <rect x="300" y="140" width="1000" height="70" rx="35" fill="#eef3ee" stroke="#9fb7a8"/>
  <text x="800" y="184" text-anchor="middle" font-size="22" fill="#235c42">天地为师：时辰 · 节气 · 所在之地</text>
  <line x1="430" y1="210" x2="430" y2="262" stroke="#9fb7a8" stroke-width="2" marker-end="url(#ar)"/>
  <line x1="1170" y1="210" x2="1170" y2="262" stroke="#9fb7a8" stroke-width="2" marker-end="url(#ar)"/>

  <!-- teacher column -->
  <rect x="80" y="265" width="700" height="690" rx="28" fill="#f3f7f4" stroke="#235c42" stroke-width="2.5"/>
  <text x="430" y="310" text-anchor="middle" font-size="26" font-weight="bold" fill="#235c42">老师这一边</text>

  <rect x="140" y="335" width="580" height="190" rx="20" fill="#ffffff" stroke="#235c42" stroke-width="2"/>
  <text x="430" y="380" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2a24">老师（真人）· 今天的扁鹊</text>
  <text x="430" y="425" text-anchor="middle" font-size="21" fill="#3d4a42">辨证施治：看诊、判断、开方</text>
  <text x="430" y="460" text-anchor="middle" font-size="21" fill="#3d4a42">定下医嘱，亲手签字</text>
  <text x="430" y="500" text-anchor="middle" font-size="18" fill="#6b7a71">把有限的时间，都用在辨证施治上</text>

  <line x1="430" y1="525" x2="430" y2="575" stroke="#235c42" stroke-width="2.5"/>
  <text x="445" y="557" font-size="16" fill="#6b7a71">替老师做事，不替老师做决定</text>

  <rect x="140" y="575" width="580" height="350" rx="20" fill="#ffffff" stroke="#235c42" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="430" y="620" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2a24">老师的智能体 · 放大器</text>
  <g font-size="20" fill="#3d4a42">
    <text x="175" y="672">● 接过杂事：整理病历、预约学生、管理学生</text>
    <text x="175" y="712">● 管理药材和器械的库存，打理账目</text>
    <text x="175" y="752">● 学老师辨证施治的思路，越学越像老师</text>
    <text x="175" y="792">● 学生发来的消息，先整理成草稿给老师</text>
    <text x="175" y="832">● 替老师随访，督促学生按医嘱修行</text>
  </g>
  <rect x="175" y="860" width="510" height="44" rx="10" fill="#fbecea"/>
  <text x="430" y="890" text-anchor="middle" font-size="19" fill="#9a3b2e">不诊断、不开方、不签字——它不代替老师</text>

  <!-- student column -->
  <rect x="820" y="265" width="700" height="690" rx="28" fill="#f2f5fa" stroke="#1d4f8f" stroke-width="2.5"/>
  <text x="1170" y="310" text-anchor="middle" font-size="26" font-weight="bold" fill="#1d4f8f">学生这一边</text>

  <rect x="880" y="335" width="580" height="190" rx="20" fill="#ffffff" stroke="#1d4f8f" stroke-width="2"/>
  <text x="1170" y="380" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2a24">学生（真人）· 修行者</text>
  <text x="1170" y="425" text-anchor="middle" font-size="21" fill="#3d4a42">跟老师学，跟天地学：学会怎样生活</text>
  <text x="1170" y="460" text-anchor="middle" font-size="21" fill="#3d4a42">按医嘱每天修行</text>
  <text x="1170" y="500" text-anchor="middle" font-size="18" fill="#6b7a71">慢慢成为自己最好的医生</text>

  <line x1="1170" y1="525" x2="1170" y2="575" stroke="#1d4f8f" stroke-width="2.5"/>
  <text x="1185" y="557" font-size="16" fill="#6b7a71">陪着学生，不替学生下结论</text>

  <rect x="880" y="575" width="580" height="350" rx="20" fill="#ffffff" stroke="#1d4f8f" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="1170" y="620" text-anchor="middle" font-size="28" font-weight="bold" fill="#1f2a24">学生的智能体 · 辅导员</text>
  <g font-size="20" fill="#3d4a42">
    <text x="915" y="672">● 把学生说的症状，整理成中医能用的文字</text>
    <text x="915" y="712">● 保管、传递师生两边的记录</text>
    <text x="915" y="752">● 督促、记录每天每周的修行</text>
    <text x="915" y="792">● 把健康的变化画成一张趋势图</text>
    <text x="915" y="832">● 陪学生慢慢建立中医的思维方式</text>
  </g>
  <rect x="915" y="860" width="510" height="44" rx="10" fill="#eef1f7"/>
  <text x="1170" y="890" text-anchor="middle" font-size="19" fill="#1d4f8f">学生自己的感受，只留在自己手机上</text>

  <!-- links -->
  <line x1="722" y1="430" x2="878" y2="430" stroke="#1f2a24" stroke-width="3" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <rect x="752" y="400" width="96" height="30" rx="8" fill="#fbfaf6"/>
  <text x="800" y="422" text-anchor="middle" font-size="20" font-weight="bold" fill="#1f2a24">师　生</text>
  <line x1="722" y1="750" x2="878" y2="750" stroke="#6b7a71" stroke-width="3" stroke-dasharray="8 6" marker-start="url(#ar)" marker-end="url(#ar)"/>
  <rect x="742" y="720" width="116" height="30" rx="8" fill="#fbfaf6"/>
  <text x="800" y="742" text-anchor="middle" font-size="19" fill="#3d4a42">点对点</text>
  <text x="800" y="782" text-anchor="middle" font-size="15" fill="#6b7a71">问诊 · 病历 · 医嘱</text>

  <text x="800" y="985" text-anchor="middle" font-size="17" fill="#6b7a71">实线框是真人，虚线框是智能体。每个人身边都有自己的智能体；智能体之间点对点相连，没有中心。</text>
</svg>
</body></html>
