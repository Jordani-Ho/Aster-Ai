name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: 急症红线只增不减
        working-directory: .
        run: node scripts/check-red-flags.mjs origin/main
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    name: e2e (environment smoke; full flow awaits M1-15a)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/e2e/browsers
      E2E_PRIVATE_PROTOC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            gateway/package-lock.json
      - name: Install native build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config python3
          rustup toolchain install 1.90.0 --profile minimal
      - name: Cache relay binaries and Cargo downloads
        uses: actions/cache@v4
        with:
          path: |
            .cache/e2e/relay
            .cache/e2e/cargo/registry
            .cache/e2e/cargo/git
            .cache/e2e/tools/protoc-31.1
          key: ${{ runner.os }}-relay-rust190-${{ hashFiles('relay/Dockerfile', 'relay/*.patch', 'e2e/build-relay.mjs') }}
          restore-keys: ${{ runner.os }}-relay-rust190-
      - run: npm ci
      - run: npm ci --prefix app
      - run: npm ci --prefix gateway
      - name: Install matching Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e-env
      - name: Build patched relay and run browser environment smoke
        run: npm run e2e
      - name: Retain synthetic-only browser failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-environment-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
