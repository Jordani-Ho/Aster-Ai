name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  gateway:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    name: e2e (consultation and local pilot metrics)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/e2e/browsers
      E2E_PRIVATE_PROTOC: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
            gateway/package-lock.json
      - name: Install native build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential cmake pkg-config python3
          rustup toolchain install 1.90.0 --profile minimal
      - name: Cache relay binaries and Cargo downloads
        id: relay-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .cache/e2e/relay
            .cache/e2e/cargo/registry
            .cache/e2e/cargo/git
            .cache/e2e/tools/protoc-31.1
          key: ${{ runner.os }}-relay-rust190-${{ hashFiles('relay/Dockerfile', 'relay/*.patch', 'e2e/build-relay.mjs') }}
          restore-keys: ${{ runner.os }}-relay-rust190-
      - run: npm ci
      - run: npm ci --prefix app
      - run: npm ci --prefix gateway
      - name: Install matching Chromium, WebKit and system libraries
        run: npx playwright install --with-deps chromium webkit
      - run: npm run typecheck:e2e
      - name: V2-03 abstractor browser integration
        run: node e2e/abstractor.browser.mjs
      - name: V2-20 tongue fix browser integration (Chromium + WebKit)
        run: node e2e/tongue.browser.mjs
      - name: V2-04 money browser integration
        run: node e2e/money.browser.mjs
      - name: V2-21 agent browser integration
        run: node e2e/agent.browser.mjs
      - name: V2-27 student nudge browser integration
        run: node e2e/nudge.browser.mjs
      - name: V2-09 storefront browser integration
        run: node e2e/storefront.browser.mjs
      - name: V2-15 opening-guide browser integration
        run: node e2e/opening.browser.mjs
      - name: V2-28 open-hall foolproof browser integration (open hall, community model, bottom bar)
        run: node e2e/v228.browser.mjs
      - name: V2-29 skip-and-version browser integration (skip to card, build version on both settings pages)
        run: node e2e/v229.browser.mjs
      - name: V2-31 setup-link browser integration (scan link autofills token, URL never carries it)
        run: node e2e/v231.browser.mjs
      - name: Invitation fragment and basics loading browser integration
        run: node e2e/hash-invite.browser.mjs
      - name: Student core-member registration and teacher invitations
        run: node e2e/core-student.browser.mjs
      - name: V2-30 posture tool browser integration (capture/import, metrics, drag+sign, trends, local assets)
        run: node e2e/posture.browser.mjs
      - name: V2-32 posture at home browser integration (student capture, package without images, teacher metrics, family)
        run: node e2e/v232.browser.mjs
      - name: V2-13 teacher-phone browser integration
        # 失败时把最后几十行作为一条 annotation 打出来：日志存储常被代理拦，annotation 走 API 能看到。
        shell: bash
        run: |
          set -o pipefail
          if ! node e2e/phone.browser.mjs 2>&1 | tee /tmp/phone.log; then
            tail -60 /tmp/phone.log | grep -v createRoot | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error title=phone.browser::/'; echo
            exit 1
          fi
      - run: npm run test:e2e-env
      - run: npm run test:deployment
      - name: Build patched relay
        run: npm run e2e:test-relay
      - name: Save successful build before browser probes
        if: steps.relay-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .cache/e2e/relay
            .cache/e2e/cargo/registry
            .cache/e2e/cargo/git
            .cache/e2e/tools/protoc-31.1
          key: ${{ runner.os }}-relay-rust190-${{ hashFiles('relay/Dockerfile', 'relay/*.patch', 'e2e/build-relay.mjs') }}
      - name: Run consultation and pilot acceptance using the verified cached relay
        # 失败时把失败用例的摘要写进 annotation（日志存储常被代理拦）。
        shell: bash
        run: |
          set -o pipefail
          if ! npm run e2e 2>&1 | tee /tmp/relay-e2e.log; then
            grep -nE "✘|Error:|Expected|Received|Locator:|at .*spec\.ts" /tmp/relay-e2e.log | head -80 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}' | sed 's/^/::error title=relay-e2e::/'; echo
            exit 1
          fi
